name: Build Ritim APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Ritim project
        run: |
          mkdir -p buildsrc
          unzip -q Ritim-Android-Pla* -d buildsrc

      - name: Build APK
        run: |
          cd buildsrc/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ritim-debug-apk
          path: buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
          
