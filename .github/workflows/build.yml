name: Build RitimPlayer APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Ritim project
        run: |
          mkdir -p buildsrc
          unzip -q Ritim-Android-Pla* -d buildsrc || true
          echo "=== Dosya Yapısı ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Build APK
        run: |
          BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "build.gradle dosyası bulunamadı!"
            exit 1
          fi
          echo "Proje dizini: $BUILD_DIR"
          cd "$BUILD_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RitimPlayer-APK
          path: /**/*.apk
          
